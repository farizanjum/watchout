<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studio | Watch Out</title><style>*{box-sizing:border-box}body{margin:0;background:#101113;color:#f1f1ed;font:14px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}h1{font-size:18px;font-weight:650;letter-spacing:-.4px;margin:0}h2{font-size:20px;margin:0 0 20px}a{color:inherit}header a{text-decoration:none;color:#aaa}label{display:block;color:#a9acb4;font-size:12px;margin:18px 0 7px}input,textarea,select{width:100%;border:1px solid #34363d;border-radius:8px;background:#191b20;color:#f5f5f3;padding:11px;font:inherit}textarea{min-height:130px;resize:vertical}button,.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #383b43;border-radius:8px;background:#24262c;color:#eee;font:600 13px system-ui;padding:11px 15px;cursor:pointer;text-decoration:none;min-height:44px}button:disabled{opacity:.4;cursor:default}.primary{background:#d7f5a0;border-color:#d7f5a0;color:#141a0c}.quiet{background:transparent}.row{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:minmax(260px,370px) 1fr;gap:42px;margin-top:24px}.video-wrap video{width:100%;max-height:680px;aspect-ratio:9/16;background:#080809;object-fit:contain;border-radius:12px}.video-wrap .row{margin-top:12px}.video-wrap .row>*{flex:1}#message{color:#d7f5a0;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;min-height:21px}#clip-picker{max-width:500px}#post-status{font-size:12px;color:#a9acb4;margin:0 0 16px}#post-status[data-state=scheduled],#post-status[data-state=published]{color:#d7f5a0}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.segmented{display:flex;background:#191b20;border:1px solid #34363d;padding:4px;border-radius:9px;gap:4px}.segmented button{flex:1;border:0;background:transparent;color:#a9acb4}.segmented button[aria-pressed=true]{background:#e8e8e3;color:#151515}#schedule-fields{padding-top:2px}.footer-actions{margin-top:25px;padding-top:20px;border-top:1px solid #292c32}.footer-actions .primary{flex:1}.hint{font-size:11px;color:#8c9099;margin:7px 0 0}details{border-top:1px solid #292c32;margin-top:24px;padding:16px 0;color:#a9acb4}summary{cursor:pointer;font-size:12px}#connection .row{margin-top:12px}.connection-body{padding-top:12px}#upcoming{margin-top:38px;border-top:1px solid #292c32;padding-top:22px}#upcoming h2{font-size:14px;color:#aaa}.scheduled-row{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:5px 20px;margin:8px 0;background:transparent}.scheduled-row span{font-size:12px;color:#aaa}.scheduled-row span:last-child{grid-column:1/-1;color:#d7f5a0}dialog{width:min(560px,calc(100% - 32px));background:#191b20;color:#eee;border:1px solid #3c3f47;border-radius:16px;padding:28px}dialog::backdrop{background:#000c;backdrop-filter:blur(4px)}.eyebrow{font-size:11px;color:#a9acb4;text-transform:uppercase;letter-spacing:1px}#confirm-title{font-size:18px;margin:14px 0}#confirm-caption{white-space:pre-wrap;color:#c2c4ca;border-top:1px solid #34363d;padding-top:15px;margin:15px 0}#confirm-when{font-size:16px;color:#d7f5a0}#confirm-settings,#confirm-channel{color:#9fa3ad;font-size:12px;overflow-wrap:anywhere}dialog .row{margin-top:24px}dialog .row .primary{flex:1}[hidden]{display:none!important}:focus-visible{outline:2px solid #d7f5a0;outline-offset:3px}@media(max-width:760px){main{padding:18px}.grid{grid-template-columns:1fr;gap:20px}.video-wrap video{max-height:48vh}.split{grid-template-columns:1fr}.scheduled-row{grid-template-columns:1fr}header{margin-bottom:20px}}</style></head><body><main>
<header><h1>Watch Out <span style="color:#777;font-weight:400">/ Studio</span></h1><a href="/">Back to clips ↗</a></header>
<label for="clip-picker">Clip</label><select id="clip-picker"><option value="">Choose a clip</option></select><div id="message" role="status" aria-live="polite"></div>
<section id="editor" class="grid" hidden><div class="video-wrap"><video id="preview" controls playsinline preload="metadata"></video><div class="row"><a id="download" class="button quiet" download>Download Clip</a><button id="copy" class="quiet">Copy Caption</button></div></div>
<div><p id="post-status" role="status"></p><form id="review-form"><label for="title">Title</label><input id="title" maxlength="100" required><label for="caption">Caption</label><textarea id="caption" maxlength="5000" required></textarea>
<label>When to publish</label><input id="delivery" type="hidden" value="now"><div class="segmented"><button id="mode-now" type="button" aria-pressed="true">Publish now</button><button id="mode-schedule" type="button" aria-pressed="false">Schedule</button></div>
<div id="schedule-fields" hidden><div class="split"><div><label for="schedule-time">Date &amp; time</label><input id="schedule-time" type="datetime-local"></div><div><label for="timezone">Timezone</label><select id="timezone"></select></div></div><p class="hint">At least 5 minutes from now. The schedule runs even when this page is closed.</p></div>
<label for="visibility">Visibility</label><select id="visibility"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select>
<div class="split"><div><label for="audience">Made for kids?</label><select id="audience" required><option value="">Choose</option><option value="false">No</option><option value="true">Yes</option></select></div><div><label for="synthetic">Realistic synthetic media?</label><select id="synthetic" required><option value="">Choose</option><option value="false">No</option><option value="true">Yes</option></select></div></div>
<div class="row footer-actions"><button id="review-button" class="primary" type="submit">Review publish</button><button id="check-status" type="button" class="quiet" hidden>Refresh status</button><button id="retry" type="button" hidden>Retry original request</button></div></form>
<div class="row" style="margin-top:10px"><button id="edit-time" hidden>Edit time</button><button id="cancel-schedule" class="quiet" hidden>Cancel schedule</button><a id="video-link" hidden target="_blank" rel="noopener noreferrer">View on YouTube ↗</a></div>
<details id="connection" hidden><summary>YouTube connection · <span id="connection-name"></span></summary><div class="connection-body"><a id="channel-link" hidden target="_blank" rel="noopener noreferrer">View channel ↗</a><button id="change-connection" class="quiet" type="button">Change connection</button><div id="setup"><form id="connect-form"><label for="api-key">Zernio API key</label><input id="api-key" type="password" autocomplete="off" required minlength="12"><div class="row"><button type="submit">Connect</button></div></form><form id="channel-form" hidden><label for="channel">Channel</label><select id="channel"></select><div class="row"><button type="submit">Use channel</button></div></form></div></div></details></div></section>
<section id="upcoming" hidden><h2>Scheduled</h2><div id="upcoming-list"></div></section></main>
<dialog id="confirm-dialog"><div class="eyebrow">Final review</div><h2 id="confirm-heading"></h2><p id="confirm-channel"></p><h3 id="confirm-title"></h3><p id="confirm-caption"></p><p id="confirm-when"></p><p id="confirm-settings"></p><div class="row"><button id="back" class="quiet">Back</button><button id="confirm-action" class="primary">Confirm</button><a id="signin" class="button primary" target="_top" hidden>Owner sign-in to confirm</a></div></dialog>
<script>const $=id=>document.getElementById(id);
let clips=[],owner=false,config={},selected=null,receipt=null,pending=null,busy=false,dirty=false;
const timezoneDefault='Asia/Dubai';
const formatTime=(time,zone)=>time?new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:zone||timezoneDefault}).format(new Date(time))+' · '+(zone||timezoneDefault):'';
const localTime=(time,zone)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(time)).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`};
function message(text){$('message').textContent=text}
async function api(path,body){const r=await fetch('/api/publisher/'+path,body===undefined?{}:{method:'POST',headers:{'content-type':'application/json','x-watchout-intent':'owner'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request could not be completed');return d}
function values(){return {clipId:selected.id,title:$('title').value,caption:$('caption').value,visibility:$('visibility').value,madeForKids:$('audience').value==='true',containsSyntheticMedia:$('synthetic').value==='true',delivery:$('delivery').value,...($('delivery').value==='schedule'?{localTime:$('schedule-time').value,timezone:$('timezone').value}:{}),confirm:true}}
function remember(){if(!selected)return;try{localStorage.setItem('watchout-draft-'+selected.id,JSON.stringify({at:Date.now(),...values(),audience:$('audience').value,synthetic:$('synthetic').value}))}catch{}}
function timing(){const scheduled=$('delivery').value==='schedule';$('schedule-fields').hidden=!scheduled;$('schedule-time').required=scheduled;$('mode-now').setAttribute('aria-pressed',String(!scheduled));$('mode-schedule').setAttribute('aria-pressed',String(scheduled))}
function fillReview(r){$('title').value=r.title??selected.title;$('caption').value=r.caption??selected.caption;$('visibility').value=r.visibility||'public';$('audience').value=r.audience??(typeof r.madeForKids==='boolean'?String(r.madeForKids):'');$('synthetic').value=r.synthetic??(typeof r.containsSyntheticMedia==='boolean'?String(r.containsSyntheticMedia):'');$('delivery').value=r.delivery||'now';$('timezone').value=r.timezone||timezoneDefault;$('schedule-time').value=r.localTime||(r.scheduledFor?localTime(r.scheduledFor,$('timezone').value):localTime(Date.now()+3600000,$('timezone').value));timing()}
function controls(){const connected=owner&&!!config.channel;const locked=receipt?.postId&&!receipt.canManageSchedule;$('connection').hidden=!owner;$('connection-name').textContent=config.channel?.name||'Connect YouTube';$('setup').hidden=!!config.channel;$('channel-link').hidden=!config.channel?.url;if(config.channel?.url)$('channel-link').href=config.channel.url;$('review-button').disabled=busy||!!locked||(owner&&!connected);$('review-button').textContent=receipt?.canManageSchedule?'Review changes':'Review publish';$('cancel-schedule').hidden=!(owner&&receipt?.status==='scheduled'&&receipt.canManageSchedule);$('edit-time').hidden=$('cancel-schedule').hidden;$('check-status').hidden=!owner||!config.channel;$('retry').hidden=!receipt?.retryAllowed;$('retry').disabled=busy;for(const id of ['cancel-schedule','edit-time','clip-picker'])$(id).disabled=busy}
function renderReceipt(r){receipt=r;const labels={not_published:'Ready to publish',scheduled:'Scheduled',cancelled:'Schedule cancelled · saved as draft',pending:'Waiting for confirmation',publishing:'Publishing',processing:'Processing',uploading:'Uploading',unknown:'Status unconfirmed · check before retrying',failed:'Publishing failed',published:'Published'};$('post-status').textContent=(labels[r.status]||r.status)+(r.status==='scheduled'?' · '+formatTime(r.scheduledFor,r.timezone):'');$('post-status').dataset.state=r.status;$('video-link').hidden=!r.videoUrl;if(r.videoUrl)$('video-link').href=r.videoUrl;controls()}
async function checkStatus(apply=false){if(!selected||!owner||!config.channel)return;const id=selected.id;try{const r=await api('status?clipId='+encodeURIComponent(id));if(selected?.id!==id)return;renderReceipt(r);if(apply&&r.review){fillReview({...r.review,...(r.scheduledFor?{scheduledFor:r.scheduledFor,localTime:null,timezone:r.timezone,delivery:'schedule'}:{})});dirty=false}}catch(e){message(e.message)}}
async function chooseClip(){selected=clips.find(c=>c.id===$('clip-picker').value);receipt=null;dirty=false;$('editor').hidden=!selected;if(!selected)return;const id=selected.id;history.replaceState(null,'','/studio?clip='+encodeURIComponent(id));$('preview').src='/media/'+selected.file;$('preview').poster='/media/'+selected.poster;$('download').href='/media/'+selected.file+'?download=1';$('download').download=selected.file.split('/').pop();fillReview({title:selected.title,caption:selected.caption});try{const saved=JSON.parse(localStorage.getItem('watchout-draft-'+id));if(saved&&Date.now()-saved.at<86400000)fillReview(saved)}catch{}$('post-status').textContent='';$('video-link').hidden=true;controls();await checkStatus(true)}
async function copyCaption(){try{await navigator.clipboard.writeText($('caption').value);message('Caption copied.')}catch{$('caption').select();message(document.execCommand('copy')?'Caption copied.':'Select the caption to copy.')}}
$('copy').onclick=copyCaption;$('download').onclick=copyCaption;$('clip-picker').onchange=chooseClip;
$('mode-now').onclick=()=>{$('delivery').value='now';timing();dirty=true;remember()};$('mode-schedule').onclick=()=>{$('delivery').value='schedule';timing();dirty=true;remember()};
$('review-form').addEventListener('input',()=>{dirty=true;remember()});$('review-form').addEventListener('change',()=>{dirty=true;remember()});
function openReview(cancel=false){const payload=cancel?{clipId:selected.id,confirm:true,expectedRevision:receipt.revision}:{...values(),...(receipt?.postId?{expectedRevision:receipt.revision}:{})};const route=cancel?'cancel-schedule':receipt?.postId?'change-schedule':'publish';pending={route,payload};$('confirm-heading').textContent=cancel?'Cancel this schedule?':payload.delivery==='schedule'?'Confirm schedule':'Publish this Short?';$('confirm-title').textContent=cancel?receipt.review.title:payload.title;$('confirm-caption').textContent=cancel?receipt.review.caption:payload.caption;$('confirm-channel').textContent=config.channel?.name||'Owner channel · sign in to continue';$('confirm-when').textContent=cancel?formatTime(receipt.scheduledFor,receipt.timezone):payload.delivery==='schedule'?payload.localTime.replace('T',' at ')+' · '+payload.timezone:'Publish now';$('confirm-settings').textContent=cancel?'The video stays saved as a draft.':payload.visibility+' · '+(payload.madeForKids?'Made for kids':'Not made for kids')+' · '+(payload.containsSyntheticMedia?'Synthetic media disclosed':'No realistic synthetic media');$('confirm-action').textContent=cancel?'Cancel schedule':payload.delivery==='schedule'?'Confirm schedule':'Publish now';$('confirm-action').hidden=!owner;$('signin').hidden=owner;$('signin').href='/signin-with-chatgpt?return_to='+encodeURIComponent('/studio?clip='+encodeURIComponent(selected.id));$('confirm-dialog').showModal()}
$('review-form').onsubmit=e=>{e.preventDefault();if(!selected)return;remember();openReview()};$('cancel-schedule').onclick=()=>openReview(true);$('edit-time').onclick=()=>{$('delivery').value='schedule';timing();$('schedule-time').focus()};$('back').onclick=()=>$('confirm-dialog').close();$('signin').onclick=remember;
async function submit(route,payload){if(busy)return;busy=true;controls();message(route==='cancel-schedule'?'Cancelling schedule…':payload.delivery==='schedule'?'Saving schedule…':'Sending to YouTube…');try{const r=await api(route,payload);renderReceipt(r);dirty=false;message(r.status==='scheduled'?'Schedule confirmed.':r.status==='cancelled'?'Schedule cancelled. The clip is saved as a draft.':r.status==='published'?'Published.':'Request saved. Check status for confirmation.');try{localStorage.removeItem('watchout-draft-'+selected.id)}catch{}await loadUpcoming()}catch(e){message(e.message);await checkStatus()}finally{busy=false;controls()}}
$('confirm-action').onclick=()=>{$('confirm-dialog').close();if(pending&&owner)submit(pending.route,pending.payload)};$('check-status').onclick=()=>checkStatus();$('retry').onclick=()=>{if(receipt?.review)submit('publish',{clipId:selected.id,...receipt.review,confirm:true})};
async function loadUpcoming(){if(!owner||!config.channel)return;const {records}=await api('statuses');$('upcoming-list').replaceChildren();const scheduled=records.filter(r=>r.status==='scheduled').sort((a,b)=>a.scheduledFor.localeCompare(b.scheduledFor));$('upcoming').hidden=!scheduled.length;for(const r of scheduled){const row=document.createElement('button');row.className='scheduled-row';row.type='button';const title=document.createElement('strong');title.textContent=r.review?.title||r.clipId;const time=document.createElement('span');time.textContent=formatTime(r.scheduledFor,r.timezone);const hint=document.createElement('span');hint.textContent='Edit time / cancel';row.append(title,time,hint);row.onclick=async()=>{$('clip-picker').value=r.clipId;await chooseClip();$('schedule-time').focus()};$('upcoming-list').append(row)}}
function showAccounts(accounts){$('channel').replaceChildren();for(const c of accounts)$('channel').append(new Option(c.name,c.id));$('channel-form').hidden=false}
$('connect-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const r=await api('connect',{apiKey:$('api-key').value.trim()});$('api-key').value='';config={configured:true};showAccounts(r.accounts);message('Choose your channel.');controls()}catch(e){message(e.message)}finally{button.disabled=false}};
$('channel-form').onsubmit=async e=>{e.preventDefault();try{config.channel=(await api('channel',{accountId:$('channel').value})).channel;controls();$('connection').open=false;await checkStatus();await loadUpcoming();message('YouTube connected.')}catch(e){message(e.message)}};
$('change-connection').onclick=async()=>{$('setup').hidden=false;try{showAccounts((await api('accounts')).accounts)}catch(e){message(e.message)}};
(async()=>{try{const zones=Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):['Asia/Dubai','Asia/Kolkata','UTC'];for(const z of new Set([timezoneDefault,'UTC',...zones]))$('timezone').append(new Option(z.replaceAll('_',' '),z));owner=(await api('session').catch(()=>({owner:false}))).owner===true;if(owner){config=await api('config');if(config.configured&&!config.channel)showAccounts((await api('accounts')).accounts)}controls();clips=await fetch('/api/clips').then(r=>r.json());clips=clips;for(const c of clips)$('clip-picker').append(new Option(c.title,c.id));$('clip-picker').value=new URLSearchParams(location.search).get('clip')||clips[0]?.id||'';await chooseClip();await loadUpcoming()}catch(e){message(e.message)}})();
setInterval(()=>{if(!busy&&owner&&config.channel){checkStatus().then(loadUpcoming).catch(e=>message(e.message))}},30000);
</script></body></html>
