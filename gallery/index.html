<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101113"><meta name="description" content="Watch Out. Download Shorts and copy ready-to-post Hinglish captions."><title>Watch Out</title><link rel="icon" href="/brand/watch-out-logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#101113;color:#f1f1ef;font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1180px,100%);margin:auto;padding:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 24px}.clip{min-width:0;display:flex;flex-direction:column}video{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#080809;border-radius:12px}p{white-space:pre-line;overflow-wrap:anywhere;margin:18px 0 20px;flex:1;font-size:15px;line-height:1.6}.actions{display:flex;gap:8px}.schedule-status{font-size:12px;color:#d7f5a0;margin-top:12px;text-decoration:none}.schedule-status[hidden]{display:none}.actions>*{display:flex;align-items:center;justify-content:center;flex:1;min-height:46px;border-radius:8px;padding:10px 8px;line-height:1.2;font-family:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}.download{background:#f0f0ed;color:#111;border:1px solid #f0f0ed}.download:hover{background:#fff}.copy{background:transparent;color:#eee;border:1px solid #414247}.copy:hover{background:#23252a;border-color:#686b70}.actions>*:focus-visible,video:focus-visible{outline:2px solid #c9f57a;outline-offset:4px}.copy.success{color:#c9f57a;border-color:#789945}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr));max-width:780px}}@media(max-width:560px){main{grid-template-columns:1fr;max-width:450px;padding:16px;gap:36px}p{margin-top:15px}.actions>*{min-height:48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header style="max-width:1180px;margin:auto;padding:20px 28px 0"><a href="/studio" aria-label="Watch Out studio" style="display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-weight:650"><img src="/brand/watch-out-logo.svg" alt="" width="40" height="40">Watch Out</a></header><main aria-label="Watch Out clips"><p id="loading" role="status">Loading clips...</p></main><div class="sr" role="status" aria-live="polite" id="status"></div>
<script>
const main=document.querySelector('main');const publishStudio=id=>'/studio?clip='+encodeURIComponent(id);
async function refreshStatuses(){if(!owner)return;try{const r=await fetch('/api/publisher/statuses');if(!r.ok)return;const {records}=await r.json();for(const a of main.querySelectorAll('article')){const badge=a.querySelector('.schedule-status'),r=records.find(x=>x.clipId===a.dataset.clipId);badge.hidden=!r;if(r)badge.textContent=r.status==='scheduled'?'Scheduled · '+new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:r.timezone}).format(new Date(r.scheduledFor))+' · '+r.timezone:r.status==='cancelled'?'Schedule cancelled':r.status==='published'?'Published':'Status: '+r.status}}catch{}}
function fallbackCopy(text){const el=document.createElement('textarea');el.value=text;el.style.cssText='position:fixed;opacity:0;left:-9999px';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();return ok}
async function copyCaption(text,button){let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch{ok=fallbackCopy(text)}button.classList.toggle('success',ok);button.textContent=ok?'Copied!':'Select Caption';document.querySelector('#status').textContent=ok?'Caption copied.':'Clipboard unavailable. Select the caption to copy it.';if(!ok){const range=document.createRange();range.selectNodeContents(button.closest('article').querySelector('p'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range)}setTimeout(()=>{button.textContent='Copy Caption';button.classList.remove('success')},2000);return ok}
let owner=false;const sessionReady=fetch('/api/publisher/session').then(r=>r.json()).then(s=>{owner=s.owner===true}).catch(()=>{});
function reorderClipCards(clips){const cards=new Map([...main.querySelectorAll('article')].map(a=>[a.dataset.clipId,a]));for(let i=0;i<clips.length;i++){const card=cards.get(clips[i].id),current=main.querySelectorAll('article')[i];if(card&&card!==current)main.insertBefore(card,current||null)}}
let loading=false;
async function refreshClips(){if(loading)return;loading=true;await sessionReady;
return fetch('/api/clips').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(clips=>{
clips=clips;
for(const a of [...main.querySelectorAll('article')]){const c=clips.find(c=>c.id===a.dataset.clipId);if(!c||a.dataset.file!==c.file)a.remove()}

document.querySelector('#loading')?.remove();document.querySelector('#retry')?.remove();
if(!clips.length){const message=document.createElement('p');message.id='loading';message.setAttribute('role','status');message.textContent='Clips are uploading. This page updates automatically.';main.append(message)}
for(const c of clips){if([...main.querySelectorAll('article')].some(a=>a.dataset.clipId===c.id))continue;const article=document.createElement('article');article.className='clip';article.dataset.clipId=c.id;article.dataset.file=c.file;article.setAttribute('aria-label',c.title);const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='none';video.poster='/media/'+c.poster;video.src='/media/'+c.file;video.setAttribute('aria-label',c.title);video.addEventListener('play',()=>document.querySelectorAll('video').forEach(other=>{if(other!==video)other.pause()}));const caption=document.createElement('p');caption.textContent=c.caption;const actions=document.createElement('div');actions.className='actions';const download=document.createElement('a');download.className='download';download.textContent='Download Clip';download.href='/media/'+c.file+'?download=1';download.download=c.file.split('/').pop();const copy=document.createElement('button');copy.className='copy';copy.type='button';copy.textContent='Copy Caption';copy.addEventListener('click',()=>copyCaption(c.caption,copy));download.addEventListener('click',()=>{copyCaption(c.caption,copy)});actions.append(download,copy);{const publish=document.createElement('a');publish.className='copy';publish.textContent='Publish';publish.href='/studio?clip='+encodeURIComponent(c.id);actions.append(publish)}const badge=document.createElement('a');badge.className='schedule-status';badge.hidden=true;badge.href=publishStudio(c.id);article.append(video,caption,actions,badge);main.append(article)}
reorderClipCards(clips);
}).catch(()=>{document.querySelector('#loading')?.remove();if(document.querySelector('#retry'))return;const retry=document.createElement('button');retry.className='copy';retry.id='retry';retry.textContent='Retry loading clips';retry.onclick=refreshClips;main.append(retry)}).finally(()=>{loading=false});}
refreshClips().then(refreshStatuses);setInterval(()=>refreshClips().then(refreshStatuses),30000);
</script></body></html>
